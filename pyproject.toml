[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "domparser"
version = "0.1.0"
description = "A command-line parser for a small subset of HTML"
requires-python = ">=3.12"

[project.scripts]
domparser = "dom_parser.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
